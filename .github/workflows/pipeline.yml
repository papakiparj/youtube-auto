name: YouTube Auto Pipeline (kahani - gaming)

on:
  schedule:
    - cron: "30 3 * * *"      # roz subah ~9:00 IST, har din agla channel
  workflow_dispatch:          # haath se "Run workflow" dabane ke liye

permissions:
  contents: write

concurrency:
  group: youtube-auto
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
          pip install requests edge-tts gtts pillow google-api-python-client google-auth

      - name: Write main.py
        run: |
          cat > main.py <<'PYEOF'
          import os, json, time, asyncio, subprocess, traceback, datetime, random, textwrap, urllib.parse
          from pathlib import Path
          import requests

          # ================= SETTINGS (zarurat ho to yahin badlo) =================
          GEMINI_MODEL = "gemini-3.5-flash"
          SCENES = 12                        # 12 scenes = lagbhag 6-8 minute
          SHORTS_COUNT = 4                   # 1 long + 4 shorts = 5 uploads (YouTube free quota me fit)
          SHORT_LEN = 50                     # seconds
          SHORT_GAP_HOURS = 4                # har Short 4 ghante baad public hoga
          MADE_FOR_KIDS = False
          REGION = "IN"
          ORDER = ["STORY", "GAME"]   # roz ek channel, baari-baari (kahani -> gaming). Tech baad me chahiye to "TECH" jodo
          CHANNELS = {
              "STORY": {
                  "label": "कहानी चैनल",
                  "voice": "hi-IN-SwaraNeural", "rate": "-8%", "pitch": "-3Hz",
                  "category": "24", "trend_cat": "24",
                  "styles": [
                      ", detailed 2D animated illustration like a Hindi horror mystery animated series, dark moody atmospheric environments, rich background detail, soft cinematic lighting, stylized cartoon characters with clean outlines, muted dark tones with warm lantern glow, no text, no logo, no gore",
                      ", 2D Indian cartoon style like Hindi story cartoons, flat colors, clean dark outlines, simple cel shading, expressive characters, night time horror mood, deep blue and purple tones with warm lantern glow and red accents, no text, no gore",
                  ],
                  "style": "",
                  "types": ["डरावनी कहानी", "रहस्य/मिस्ट्री कहानी", "पुरानी हवेली/लोककथा", "रोमांचक सस्पेंस कहानी"],
                  "brief": ("Ye Hindi kahaniyon ka channel hai. Ek bilkul nayi, original aur KAALPANIK kahani likho. "
                            "Koi asli vyakti, asli ghatna ya asli naam mat lo. Zyada khoon-kharaba ya hinsa nahi. "
                            "Shuruaat me strong hook, beech me suspense, ant me twist."),
                  "disclaimer": "⚠️ यह कहानी पूरी तरह काल्पनिक है।",
              },
              "TECH": {
                  "label": "टेक चैनल",
                  "voice": "hi-IN-SwaraNeural",
                  "category": "28", "trend_cat": "28",
                  "style": ", generic modern gadget on a desk, studio lighting, clean product photo style, no brand names, no logos, no text",
                  "types": ["वायरल प्रोडक्ट की पूरी जानकारी", "फायदे-नुकसान और किसके लिए सही", "कैसे इस्तेमाल करें गाइड"],
                  "brief": ("Ye viral gadgets/products ka explainer channel hai. Neeche diye 'Facts' ke andar ki baatein hi use karo, "
                            "apni taraf se specs ya numbers mat banao. Video me saaf batao: kya achha hai, kya kharab hai, "
                            "kaise use karte hain, kiske liye sahi hai. Shuru me ek line bolo ki ye jaankari public sources par "
                            "based hai aur humne product khud test nahi kiya. 'Maine use kiya/test kiya' jaisa kuch mat bolo. "
                            "Image prompts me koi brand name ya logo mat likho, generic gadget dikhao."),
                  "disclaimer": "ℹ️ यह वीडियो सार्वजनिक जानकारी पर आधारित है। हमने प्रोडक्ट खुद टेस्ट नहीं किया है।",
              },
              "GAME": {
                  "label": "Bhuri Gamer चैनल",
                  "voice": "hi-IN-SwaraNeural", "rate": "+6%", "pitch": "+0Hz",
                  "category": "20", "trend_cat": "20",
                  "style": ", anime style illustration, dark black and electric blue color palette, glowing blue flames, cinematic dramatic lighting, battle royale game mood, no text, no logos",
                  "host": "main host character: a teenage anime boy gamer with spiky black hair, bright blue eyes, black hoodie, holding a black game controller",
                  "types": ["Free Fire MAX के अजीब-ग़रीब फैक्ट्स", "Free Fire MAX के आने वाले अपडेट/इवेंट की जानकारी",
                            "Free Fire MAX के कैरेक्टर और पेट्स की कहानी", "Free Fire MAX टॉप 10 लिस्ट",
                            "Free Fire MAX की फनी कहानी/स्किट (AI से बनी काल्पनिक)"],
                  "brief": ("Ye sirf Free Fire MAX ka channel hai (title, tags aur description me 'Free Fire MAX' likho). Video aisi banao jisme khelna na pade: facts, aane wale update/event ki "
                            "jaankari, character/pet lore, top-10 list, ya mazedaar KAALPANIK funny kahani. Update/event/fact wali "
                            "baatein sirf 'Facts' me mile pakki jaankari se likho, apni taraf se date ya detail mat banao. Agar Facts "
                            "me kuch nahi hai, to sirf funny kahani wala type chuno. Asli gameplay dikhane ya khud khelne ka daava "
                            "mat karo. Image prompts me asli character ke naam ya logo mat likho, generic stylized battle-royale "
                            "scene likho. Channel ka naam 'Bhuri Gamer' hai; video me ek fixed anime host (kala hoodie, neeli aankhen) hai, "
                            "jo kai scenes me dikhna chahiye. Facts-host jaisa news-anchor style nahi, balki mazedaar gamer dost jaisa andaaz rakho. "
                            "Mazedaar, tez bolchal wali bhasha."),
                  "disclaimer": "ℹ️ यह एक फैन-मेड वीडियो है, Garena से जुड़ा नहीं है।",
              },
          }
          # =========================================================================

          E = os.environ
          DC_WEBHOOK = E["DISCORD_WEBHOOK"]               # reports ke liye (zaroori)
          DC_TOKEN = E.get("DISCORD_BOT_TOKEN", "")       # topic/script bhejne ke liye (optional)
          DC_CHANNEL = E.get("DISCORD_CHANNEL_ID", "")    # optional
          GEMINI_KEY = E["GEMINI_API_KEY"]
          W = Path("work")
          W.mkdir(exist_ok=True)
          STATE_FILE = Path("state.json")


          def load_state():
              if STATE_FILE.exists():
                  return json.loads(STATE_FILE.read_text())
              return {"history": [], "last_message_id": ""}


          def save_state(s):
              STATE_FILE.write_text(json.dumps(s, ensure_ascii=False, indent=1))


          def notify(text):
              """Discord channel me message bhejta hai (webhook se)."""
              text = str(text)
              for part in [text[i:i + 1900] for i in range(0, min(len(text), 5700), 1900)] or [""]:
                  for _ in range(3):
                      try:
                          r = requests.post(DC_WEBHOOK, json={"content": part}, timeout=30)
                          if r.status_code == 429:
                              time.sleep(float(r.json().get("retry_after", 2)) + 0.5)
                              continue
                          break
                      except Exception as e:
                          print("discord fail:", e)
                          time.sleep(2)


          def retry(fn, tries=3, wait=10):
              for i in range(tries):
                  try:
                      return fn()
                  except Exception as e:
                      print("retry", i + 1, e)
                      if i == tries - 1:
                          raise
                      time.sleep(wait * (i + 1))


          def discord_input(state):
              """Discord channel me aapka naya message (topic ya script) padhta hai. Bot token na ho to skip."""
              if not (DC_TOKEN and DC_CHANNEL):
                  return ""
              try:
                  params = {"limit": 50}
                  if state.get("last_message_id"):
                      params["after"] = state["last_message_id"]
                  r = requests.get(
                      f"https://discord.com/api/v10/channels/{DC_CHANNEL}/messages",
                      params=params, headers={"Authorization": f"Bot {DC_TOKEN}"}, timeout=30,
                  )
                  r.raise_for_status()
                  msgs = sorted(r.json(), key=lambda m: int(m["id"]))
                  text = ""
                  for m in msgs:
                      state["last_message_id"] = m["id"]
                      if m.get("author", {}).get("bot") or m.get("webhook_id"):
                          continue
                      if m.get("content"):
                          text = m["content"]
                  return text
              except Exception as e:
                  print("discord read fail:", e)
                  return ""


          GEMINI_BACKUPS = ["gemini-3.5-flash-lite", "gemini-3.6-flash"]   # main model busy/band ho to ye try honge


          def _gemini_call(body):
              last = None
              for model in [GEMINI_MODEL] + GEMINI_BACKUPS:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
                  for attempt in range(3):
                      try:
                          r = requests.post(url, json=body, headers={"x-goog-api-key": GEMINI_KEY}, timeout=240)
                      except requests.exceptions.RequestException as e:
                          last = e
                          time.sleep(20)
                          continue
                      if r.status_code == 200:
                          parts = r.json()["candidates"][0]["content"]["parts"]
                          return "".join(p.get("text", "") for p in parts)
                      last = Exception(f"{model}: HTTP {r.status_code} {r.text[:200]}")
                      if r.status_code in (429, 500, 502, 503, 504):
                          time.sleep(20)          # busy, thodi der ruk kar dobara
                          continue
                      break                        # 404/400 etc: agla model try karo
                  print("gemini fail, next model:", last)
              raise last


          def gemini(prompt):
              body = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {"responseMimeType": "application/json", "temperature": 1.0},
              }
              return json.loads(_gemini_call(body))


          def gemini_text(prompt, search=False):
              body = {"contents": [{"parts": [{"text": prompt}]}]}
              if search:
                  body["tools"] = [{"google_search": {}}]
              return _gemini_call(body)


          def yt_client(refresh_token):
              from google.oauth2.credentials import Credentials
              from googleapiclient.discovery import build

              creds = Credentials(
                  None,
                  refresh_token=refresh_token,
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=E["YT_CLIENT_ID"],
                  client_secret=E["YT_CLIENT_SECRET"],
              )
              return build("youtube", "v3", credentials=creds, cache_discovery=False)


          def trending(yt, cat):
              try:
                  r = yt.videos().list(
                      part="snippet", chart="mostPopular", regionCode=REGION,
                      videoCategoryId=cat, maxResults=15,
                  ).execute()
                  return [i["snippet"]["title"] for i in r.get("items", [])]
              except Exception as e:
                  print("trending fail:", e)
                  return []


          def get_facts(key, trend, past):
              if key == "TECH":
                  prompt = (f"Aaj India me viral ya trending gadgets/tech products me se EK chuno "
                            f"(in purane topics ko chhodkar: {json.dumps(past, ensure_ascii=False)}). "
                            f"Trending titles ka hint: {json.dumps(trend, ensure_ascii=False)}. "
                            "Web search se uski sahi jaankari do: naam, availability, India price, mukhya specs, "
                            "3 fayde, 3 nuksaan, kaise use karte hain, kiske liye sahi hai. "
                            "Sirf wahi likho jo sources me mile; na mile to 'pata nahi' likho.")
              else:
                  prompt = ("Web search se Free Fire MAX ke bare me taza pakki jaankari do: aane wale ya naye update, "
                            "events, naye characters/pets, aur 5 sachche rochak facts. Har baat ke saath saaf likho ki wo kab ki hai. "
                            f"In purane topics ko chhodo: {json.dumps(past, ensure_ascii=False)}. "
                            "Sirf wahi likho jo sources me mile; na mile to 'pata nahi' likho.")
              try:
                  return gemini_text(prompt, search=True).strip()
              except Exception as e:
                  print("facts fail:", e)
                  return ""


          def make_plan(key, ch, trend, state, user_text):
              past = [h.get("topic", "") for h in state["history"] if h.get("channel") == key][-30:]
              facts = ""
              if key in ("TECH", "GAME"):
                  facts = get_facts(key, trend, past)
                  if not facts and key == "TECH":
                      raise Exception("Tech product ki sahi jaankari nahi mili, isliye video nahi bani")
              prompt = f"""Tum ek YouTube channel ({ch['label']}) ke head writer ho.
          {ch['brief']}
          Aaj ke trending titles: {json.dumps(trend, ensure_ascii=False)}
          Pehle bane topics (inhe repeat mat karo): {json.dumps(past, ensure_ascii=False)}
          Video type options: {json.dumps(ch['types'], ensure_ascii=False)}
          Facts: {facts or "(none)"}
          User ka idea ya script (agar diya hai to ussi par video banao): {user_text or "(none)"}

          Ek alag video type aur topic chuno, aur {SCENES} scenes ki 6 se 8 minute ki video likho.
          Narration Hindi (Devanagari) me likho, English words zarurat par English me, bolchal wali mazedaar bhasha, har scene me lagbhag 70 se 85 shabd. Shuruaat me strong hook.
          Image prompts me jahan kirdar ho, 'characters' wale description ke hisaab se hi unhe dikhao taaki har scene me wahi kirdar lage.
          Sirf JSON do, bilkul is shape me:
          {{"video_type": "", "topic": "", "title": "(max 90 chars, catchy)", "description": "(SEO, 3-4 lines + hashtags)", "tags": ["..."], "thumb_text": "(English CAPS, max 4 words)", "characters": "(English, main kirdaron ka FIXED chhota description: umar, ladka/ladki, baal, kapde ke rang, body; har video me wahi rahe. Agar kirdar nahi to khali)", "scenes": [{{"narration": "", "image_prompt": "(English, detailed, no text in image)"}}]}}"""
              plan = gemini(prompt)
              sc = [s for s in plan.get("scenes", []) if s.get("narration") and s.get("image_prompt")]
              if len(sc) < 3:
                  raise Exception("Gemini ne sahi scenes nahi diye")
              plan["scenes"] = sc[:SCENES]
              return plan


          def run(cmd):
              p = subprocess.run(cmd, capture_output=True, text=True)
              if p.returncode:
                  raise Exception("command fail: " + " ".join(cmd[:3]) + "\n" + p.stderr[-800:])


          def dur(path):
              out = subprocess.check_output(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "default=nw=1:nk=1", str(path)]
              )
              return float(out.strip())


          def make_image(prompt, path, style, seed):
              from PIL import Image

              q = urllib.parse.quote(prompt + style)
              url = f"https://image.pollinations.ai/prompt/{q}?width=1280&height=720&nologo=true&seed={seed}"

              def go():
                  r = requests.get(url, timeout=120)
                  r.raise_for_status()
                  if "image" not in r.headers.get("content-type", ""):
                      raise Exception("image nahi mili")
                  path.write_bytes(r.content)
                  Image.open(path).convert("RGB").save(path, "JPEG")

              try:
                  retry(go, tries=3, wait=8)
              except Exception as e:
                  print("image fallback:", e)
                  Image.new("RGB", (1280, 720), (random.randint(20, 90), random.randint(60, 140), random.randint(20, 90))).save(path, "JPEG")


          def make_voice(text, path, voice, rate="+0%", pitch="+0Hz"):
              def go():
                  import edge_tts

                  async def a():
                      await edge_tts.Communicate(text, voice, rate=rate, pitch=pitch).save(str(path))

                  asyncio.run(a())

              try:
                  retry(go, tries=3, wait=5)
              except Exception as e:
                  print("edge-tts fail, gTTS use ho raha hai:", e)
                  from gtts import gTTS

                  gTTS(text, lang="hi").save(str(path))


          def make_scene(i, sc, ch, seed=1, chars=""):
              img, voice, clip = W / f"s{i}.jpg", W / f"s{i}.mp3", W / f"s{i}.mp4"
              make_image((chars + ". " if chars else "") + sc["image_prompt"], img, ch["style"], seed)
              make_voice(sc["narration"], voice, ch["voice"], ch.get("rate", "+0%"), ch.get("pitch", "+0Hz"))
              d = dur(voice) + 0.4
              frames = int(d * 25) + 1
              if i % 2 == 0:
                  z = "min(zoom+0.0008,1.3)"
              else:
                  z = "if(lte(on,1),1.3,max(zoom-0.0008,1.0))"
              vf = (f"[0:v]scale=2560:1440,zoompan=z='{z}':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)'"
                    f":d={frames}:s=1280x720:fps=25,format=yuv420p[v]")
              af = "[1:a]apad[v1];[2:a]volume=0.35[p];[v1][p]amix=inputs=2:duration=first:dropout_transition=0,volume=2[a]"
              run(["ffmpeg", "-y", "-i", str(img), "-i", str(voice),
                   "-f", "lavfi", "-t", "0.12", "-i", "sine=frequency=760",
                   "-filter_complex", vf + ";" + af, "-map", "[v]", "-map", "[a]",
                   "-t", f"{d:.2f}", "-r", "25", "-c:v", "libx264", "-preset", "veryfast", "-crf", "24",
                   "-c:a", "aac", "-ar", "44100", "-ac", "2", str(clip)])
              return d


          def srt_time(t):
              h, m, s = int(t // 3600), int(t % 3600 // 60), t % 60
              return f"{h:02}:{m:02}:{int(s):02},{int((s % 1) * 1000):03}"


          def write_srt(path, entries, offset=0.0, length=None):
              lines, n = [], 0
              for (a, b, text) in entries:
                  if b <= offset or (length is not None and a >= offset + length):
                      continue
                  a2, b2 = max(a - offset, 0), b - offset
                  if length is not None:
                      b2 = min(b2, length)
                  n += 1
                  lines.append(f"{n}\n{srt_time(a2)} --> {srt_time(b2)}\n{text}\n")
              Path(path).write_text("\n".join(lines), encoding="utf-8")


          def make_thumb(first_img, text, path):
              from PIL import Image, ImageDraw, ImageFont

              im = Image.open(first_img).convert("RGB").resize((1280, 720))
              d = ImageDraw.Draw(im)
              try:
                  f = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 110)
              except Exception:
                  f = ImageFont.load_default()
              for k, line in enumerate(textwrap.wrap(text.upper(), 14)[:3]):
                  d.text((50, 40 + k * 130), line, font=f, fill=(255, 230, 0), stroke_width=8, stroke_fill=(0, 0, 0))
              im.save(path, "JPEG", quality=88)


          def upload(yt, path, title, desc, tags, category, publish_at=None):
              from googleapiclient.http import MediaFileUpload

              keep, total = [], 0
              for t in tags:
                  t = str(t)[:30]
                  if total + len(t) > 400:
                      break
                  keep.append(t)
                  total += len(t)
              status = {"privacyStatus": "public", "selfDeclaredMadeForKids": MADE_FOR_KIDS,
                        "containsSyntheticMedia": True}
              if publish_at:
                  status["privacyStatus"] = "private"
                  status["publishAt"] = publish_at
              body = {"snippet": {"title": title[:100], "description": desc[:4900], "tags": keep,
                                  "categoryId": category, "defaultLanguage": "hi"},
                      "status": status}
              req = yt.videos().insert(part="snippet,status", body=body,
                                       media_body=MediaFileUpload(str(path), chunksize=8 * 1024 * 1024, resumable=True))
              resp = None
              while resp is None:
                  _, resp = req.next_chunk(num_retries=5)
              return resp["id"]


          def main():
              state = load_state()
              idx = state.get("next_channel", 0) % len(ORDER)
              key = None
              for off in range(len(ORDER)):
                  k = ORDER[(idx + off) % len(ORDER)]
                  if E.get(f"YT_REFRESH_TOKEN_{k}"):
                      key = k
                      break
              if not key:
                  notify("⚠️ Kisi bhi channel ka secret nahi mila (YT_REFRESH_TOKEN_STORY / _GAME).")
                  return
              ch = dict(CHANNELS[key])
              if ch.get("styles"):
                  ch["style"] = random.choice(ch["styles"])
              user_text = discord_input(state)
              notify(f"🚀 आज की बारी: {ch['label']}" + (f"\nAapka idea: {user_text[:200]}" if user_text else "\n(Trend dekhkar topic khud chun raha hu)"))

              yt = yt_client(E[f"YT_REFRESH_TOKEN_{key}"])
              trend = trending(yt, ch["trend_cat"])
              plan = retry(lambda: make_plan(key, ch, trend, state, user_text), tries=3, wait=15)
              notify(f"📝 Type: {plan.get('video_type')}\nTopic: {plan.get('topic')}\nTitle: {plan.get('title')}\nScenes: {len(plan['scenes'])}")

              durs, entries, t0 = [], [], 0.0
              seed = random.randint(1, 99999)
              for i, sc in enumerate(plan["scenes"]):
                  d = make_scene(i, sc, ch, seed, (ch.get("host", "") + ". " + plan.get("characters", "")).strip(". "))
                  durs.append(d)
                  words = sc["narration"].split()
                  chunks = [" ".join(words[k:k + 7]) for k in range(0, len(words), 7)] or [""]
                  speak, tt = max(d - 0.4, 1.0), t0
                  for c in chunks:
                      seg = speak * len(c.split()) / max(len(words), 1)
                      entries.append((tt, tt + seg, c))
                      tt += seg
                  t0 += d
                  if (i + 1) % 4 == 0:
                      notify(f"🎬 {i + 1}/{len(plan['scenes'])} scenes ready")

              lst = W / "list.txt"
              lst.write_text("".join(f"file 's{i}.mp4'\n" for i in range(len(durs))))
              base = W / "base.mp4"
              run(["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", str(lst), "-c", "copy", str(base)])

              music = Path("assets/music.mp3")
              if music.exists():
                  mixed = W / "base_music.mp4"
                  run(["ffmpeg", "-y", "-i", str(base), "-stream_loop", "-1", "-i", str(music),
                       "-filter_complex", "[1:a]volume=0.12[m];[0:a][m]amix=inputs=2:duration=first:dropout_transition=0,volume=2[a]",
                       "-map", "0:v", "-map", "[a]", "-c:v", "copy", "-c:a", "aac", str(mixed)])
                  base = mixed

              srt = W / "subs.srt"
              write_srt(srt, entries)
              long_mp4 = W / "long.mp4"
              run(["ffmpeg", "-y", "-i", str(base), "-vf",
                   f"subtitles={srt}:force_style='FontName=Noto Sans Devanagari,FontSize=16,Outline=2,MarginV=25'",
                   "-c:v", "libx264", "-preset", "veryfast", "-crf", "24", "-c:a", "copy", str(long_mp4)])
              total = dur(long_mp4)
              notify(f"✅ Video ban gayi ({total / 60:.1f} min). Upload ho rahi hai...")

              thumb = W / "thumb.jpg"
              make_thumb(W / "s0.jpg", plan.get("thumb_text") or plan["title"], thumb)

              disc = ("\n\n" + ch["disclaimer"]) if ch["disclaimer"] else ""
              vid = upload(yt, long_mp4, plan["title"], plan["description"] + disc, plan.get("tags", []), ch["category"])
              try:
                  from googleapiclient.http import MediaFileUpload
                  yt.thumbnails().set(videoId=vid, media_body=MediaFileUpload(str(thumb))).execute()
              except Exception as e:
                  notify(f"⚠️ Thumbnail set nahi hua: {str(e)[:200]}")
              long_url = f"https://youtu.be/{vid}"
              state["next_channel"] = (ORDER.index(key) + 1) % len(ORDER)
              state["history"].append({"date": datetime.date.today().isoformat(), "channel": key, "type": plan.get("video_type"),
                                       "topic": plan.get("topic"), "title": plan["title"], "url": long_url})
              save_state(state)
              notify(f"📺 Long video upload ho gayi:\n{long_url}")

              now = datetime.datetime.now(datetime.timezone.utc)
              for k in range(SHORTS_COUNT):
                  try:
                      start = 0 if SHORTS_COUNT == 1 else max((total - SHORT_LEN - 1) * k / (SHORTS_COUNT - 1), 0)
                      ssrt = W / f"short{k}.srt"
                      write_srt(ssrt, entries, offset=start, length=SHORT_LEN)
                      out = W / f"short{k}.mp4"
                      run(["ffmpeg", "-y", "-ss", f"{start:.2f}", "-i", str(base), "-t", str(SHORT_LEN), "-vf",
                           f"crop=ih*9/16:ih,scale=1080:1920,subtitles={ssrt}:force_style='FontName=Noto Sans Devanagari,FontSize=12,Outline=2,MarginV=60'",
                           "-c:v", "libx264", "-preset", "veryfast", "-crf", "24", "-c:a", "aac", str(out)])
                      when = (now + datetime.timedelta(hours=SHORT_GAP_HOURS * (k + 1))).strftime("%Y-%m-%dT%H:%M:%SZ")
                      sid = upload(yt, out, f"{plan['title'][:80]} #Shorts",
                                   f"Poori video: {long_url}\n\n{plan['description']}{disc}\n#Shorts",
                                   plan.get("tags", []) + ["Shorts"], ch["category"], publish_at=when)
                      out.unlink(missing_ok=True)
                      notify(f"📱 Short {k + 1}/{SHORTS_COUNT} scheduled ({when}):\nhttps://youtube.com/shorts/{sid}")
                  except Exception as e:
                      notify(f"⚠️ Short {k + 1} fail: {str(e)[:300]}")

              notify("🎉 Aaj ka kaam pura. Kal agle channel ki baari.")


          if __name__ == "__main__":
              try:
                  main()
              except Exception:
                  notify("❌ Error aaya:\n" + traceback.format_exc()[-1500:])
                  raise
          PYEOF

      - name: Run pipeline
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_STORY: ${{ secrets.YT_REFRESH_TOKEN_STORY }}
          YT_REFRESH_TOKEN_GAME: ${{ secrets.YT_REFRESH_TOKEN_GAME }}
        run: python main.py

      - name: Save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state update" && git push)
